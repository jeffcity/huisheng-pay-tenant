    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    async function copyText(value) {
      const text = String(value ?? "");
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        void error;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        return Boolean(document.execCommand?.("copy"));
      } catch (error) {
        return false;
      } finally {
        textarea.remove();
      }
    }

    function bindToastButtons() {
      document.querySelectorAll("[data-toast]").forEach((btn) => {
        btn.onclick = () => showToast(btn.dataset.toast);

    function updateCrumbs(title) {

    function setActiveNav(pageKey) {
      document.querySelectorAll(".nav-button[data-page]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.page === pageKey);

      const activeButton = document.querySelector(`.nav-button[data-page="${pageKey}"]`);
      const group = activeButton?.closest("[data-collapsible-nav]");
      if (group) setNavGroupCollapsed(group, false);
    }

    function setNavGroupCollapsed(group, collapsed) {
      group.classList.toggle("is-collapsed", collapsed);
      const trigger = group.querySelector("[data-nav-toggle]");
      if (trigger) trigger.setAttribute("aria-expanded", String(!collapsed));
    }

    function renderMerchantListPage() {
      document.querySelector(".content").innerHTML = merchantListTemplate;
      updateCrumbs("商户管理");
      setActiveNav("merchant-list");

      bindMerchantListEvents();

    function bindMerchantListEvents() {

        document.getElementById(id).addEventListener("input", renderRows);
      });

      document.getElementById("merchantRows").addEventListener("click", (event) => {

        if (walletDetail) {
          openWalletModal(walletDetail.dataset.walletDetail);
          return;
        }

        const detail = event.target.closest("[data-detail]");
        if (detail) {
          openDetail(detail.dataset.detail);
          return;
        }
        const toggle = event.target.closest("[data-merchant-toggle]");
        if (toggle) {
          const item = merchants.find((merchant) => merchant.id === toggle.dataset.merchantToggle);
          openMerchantStatusModal([toggle.dataset.merchantToggle], item?.status === "停用" ? "启用" : "停用");
        }
      });

      document.getElementById("merchantRows").addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-merchant-select]");
        if (!checkbox) return;
        if (checkbox.checked) selectedMerchantIds.add(checkbox.dataset.merchantSelect);
        else selectedMerchantIds.delete(checkbox.dataset.merchantSelect);
        renderRows();
      });

      document.getElementById("selectAllMerchants").addEventListener("change", (event) => {
        filteredMerchants().forEach((item) => event.target.checked ? selectedMerchantIds.add(item.id) : selectedMerchantIds.delete(item.id));
        renderRows();
      });

      document.getElementById("batchToggleBtn").addEventListener("click", () => openMerchantStatusModal([...selectedMerchantIds]));

      document.getElementById("newMerchantBtn").addEventListener("click", openCreateModal);

    }

    function bindShellEvents() {
      const shellRoutes = {
        home: '../../00-总览/00-租户端总览设计/租户端总览设计-demo.html#home',
        collect: '../../00-总览/00-租户端总览设计/租户端总览设计-demo.html#collect',
        channels: '../../00-总览/00-租户端总览设计/租户端总览设计-demo.html#channels',
        reports: '../../00-总览/00-租户端总览设计/租户端总览设计-demo.html#reports',
        tickets: '../../00-总览/00-租户端总览设计/租户端总览设计-demo.html#tickets',
        system: '../../05-系统管理/02-系统管理/租户端系统管理-demo.html#accounts'

      document.querySelectorAll("[data-shell-route]").forEach((button) => {

      document.querySelectorAll("[data-nav-toggle]").forEach((trigger) => {
        trigger.addEventListener("click", () => {
          const group = trigger.closest("[data-collapsible-nav]");
          if (!group) return;
          setNavGroupCollapsed(group, !group.classList.contains("is-collapsed"));
          if (window.lucide) window.lucide.createIcons();

      document.querySelectorAll(".nav-button[data-page]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const pageKey = btn.dataset.page;
          if (pageKey === "merchant-list") {

      document.getElementById("modalMask").addEventListener("click", closeModal);
      document.addEventListener("keydown", (event) => {
        if (!document.getElementById("modal").classList.contains("open")) return;

    merchantListTemplate = document.querySelector(".content").innerHTML;
    window.__HSMerchantPrototype = {
      setCurrentAccount: (account) => { currentTenantOperator.account = String(account || "Jeff"); },
      getFundingOrder: (orderId) => {

      },
      getMerchantWithdrawalSuccessFact: orderId => {

        if (!order || order.id !== "WD-M-0715-0172") return null;
        return { merchantWithdrawalNo: order.id, applicationAmount: Number(order.amount.replaceAll(",", "")), merchantWithdrawalFee: Number(order.fee.replaceAll(",", "")), netPayoutAmount: Number(order.netPayoutAmount.replaceAll(",", "")), tenantPayoutRequest: order.tenantPayoutRequest, platformOrder: order.platformOrder, statusVersion: order.platformStatusVersion, successEventId: order.platformSuccessEventId, idempotencyKey: order.idempotencyKey, merchantFreezeTransactionId: order.merchantFreezeTransactionId, merchantSuccessTransactionId: order.merchantSuccessTransactionId, merchantLedgerIds: [...order.ledgerIds], ledgerCorrelationId: order.ledgerCorrelation, merchantWalletBefore: { ...order.walletBefore }, merchantWalletAfterFreeze: { ...order.walletAfterFreeze }, merchantWalletAfterSuccess: { ...order.walletAfterSuccess }, dataBoundary: "平台提交投影不含原商户申请号、商户手续费、商户钱包或商户流水" };
      },
      resetMerchantWithdrawalSuccessRecoveryState: () => {

        return cloneMerchantWithdrawalRecoveryState();

      getMerchantWithdrawalSuccessRecoveryState: () => cloneMerchantWithdrawalRecoveryState(),
      consumeMerchantWithdrawalSuccessEvent: (eventId, statusVersion, outcome = "success") => consumeMerchantWithdrawalSuccessEvent(eventId, statusVersion, outcome),
      getMerchantNonWithdrawalFundFact: applicationId => merchantNonWithdrawalFacts[String(applicationId)] ? JSON.parse(JSON.stringify(merchantNonWithdrawalFacts[String(applicationId)])) : null,
      resetMerchantNonWithdrawalRecoveryState: () => {
        merchantNonWithdrawalRecoveryState = initialMerchantNonWithdrawalRecoveryState();
        return cloneMerchantNonWithdrawalRecoveryState();
      },
      getMerchantNonWithdrawalRecoveryState: () => cloneMerchantNonWithdrawalRecoveryState(),
      applyMerchantNonWithdrawalReview: (applicationId, idempotencyKey, expectedEntityVersion, expectedWalletVersion, outcome = "success", requestAmount) => applyMerchantNonWithdrawalReview(applicationId, idempotencyKey, expectedEntityVersion, expectedWalletVersion, outcome, requestAmount),
      getFundingFilters: () => ({ ...fundingFilters }),
      getFundingSourceContext: () => fundingSourceContext ? { ...fundingSourceContext } : null,
      openFundingHistory: (merchantId, wallet) => openMerchantFundingHistory(String(merchantId), String(wallet)),
      setFundingVersion: (orderId, version) => {
        const order = fundingOrders.find((item) => item.id === orderId);
        if (!order) return false;
        order.entityVersion = Number(version);
        return true;
      },
      getPayoutChannels: () => tenantPayoutChannels.map((channel) => ({ ...channel })),
      setPayoutChannelStatus: (channelId, status, acceptsNewOrders = status === "正常") => {
        const channel = tenantPayoutChannels.find((item) => item.id === channelId);
        if (!channel) return false;
        channel.status = String(status);
        channel.acceptsNewOrders = Boolean(acceptsNewOrders);
        return true;
      }
    };
    bindShellEvents();
    const initialPage = window.__UNIFIED_DEMO_HASH || window.location.hash.replace("#", "");
    if (modulePages[initialPage]) renderModulePage(initialPage);
    else renderMerchantListPage();
    if (window.lucide) window.lucide.createIcons();
  </script>
  <script>
    (() => {
      const liveId = "hsFormErrorLive";
      const nativeErrorClass = "hs-native-field-error";
      const errorSelector = `.form-error, .field-error, .error-text, [data-error], .${nativeErrorClass}`;
      const fieldSelector = 'input:not([type="hidden"]), select, textarea';
      const fieldContainerSelector = '.field, .form-field, .modal-field, .blue-row, .setting-row, .filter-item, .form-group, .control-group';
      let errorSequence = 0;
      let fieldLabelSequence = 0;

      function normalizedLabelText(label) {
        if (!(label instanceof HTMLElement)) return "";
        const copy = label.cloneNode(true);
        copy.querySelectorAll("input, select, textarea, button, svg, i").forEach(node => node.remove());
        return copy.textContent.replace(/\s+/g, " ").trim();
      }

      function hasAccessibleFieldName(field) {
        if ((field.getAttribute("aria-label") || "").trim()) return true;
        const labelledByText = (field.getAttribute("aria-labelledby") || "")
          .split(/\s+/)
          .filter(Boolean)
          .map(id => document.getElementById(id)?.textContent?.replace(/\s+/g, " ").trim() || "")
          .filter(Boolean)
          .join(" ");
        if (labelledByText) return true;
        return Array.from(field.labels || []).some(label => normalizedLabelText(label));
      }

      function upgradeFieldName(field) {
        if (!(field instanceof HTMLElement) || !field.matches(fieldSelector) || hasAccessibleFieldName(field)) return;
        const container = field.closest(fieldContainerSelector);
        const label = container?.querySelector("label");
        if (!label || !normalizedLabelText(label)) return;
        if (!label.id) label.id = `hsFieldLabel${++fieldLabelSequence}`;
        const ids = new Set((field.getAttribute("aria-labelledby") || "").split(/\s+/).filter(Boolean));
        ids.add(label.id);
        field.setAttribute("aria-labelledby", [...ids].join(" "));
      }

      function ensureNativeErrorStyles() {
        if (document.getElementById("hsNativeFieldErrorStyles")) return;
        const style = document.createElement("style");
        style.id = "hsNativeFieldErrorStyles";
        style.textContent = `
          .${nativeErrorClass} {
            display: block;
            flex: 0 0 100%;
            width: 100%;
            max-width: 100%;
            margin: 6px 0 0;
            color: var(--color-danger, var(--danger, #b42318));
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
          }
          .${nativeErrorClass}[hidden] { display: none !important; }
        `;
        document.head.appendChild(style);
      }

      function fieldKey(field) {
        if (!field.dataset.hsFeedbackKey) {
          field.dataset.hsFeedbackKey = field.id || `hsFeedbackField${++errorSequence}`;
        }
        return field.dataset.hsFeedbackKey;
      }

      function ensureLiveRegion() {
        let live = document.getElementById(liveId);
        if (live) return live;
        live = document.createElement("div");
        live.id = liveId;
        live.setAttribute("role", "alert");
        live.setAttribute("aria-live", "assertive");
        live.setAttribute("aria-atomic", "true");
        live.style.cssText = "position:fixed;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0";
        document.body.appendChild(live);
        return live;
      }

      function upgradeErrorNode(node) {
        if (!(node instanceof HTMLElement) || !node.matches(errorSelector)) return null;
        if (!node.id) node.id = `hsFieldError${++errorSequence}`;
        node.setAttribute("role", "alert");
        node.setAttribute("aria-live", "assertive");
        node.setAttribute("aria-atomic", "true");
        return node;
      }

      function ensureNativeError(field) {
        let node = field.dataset.hsNativeErrorId
          ? document.getElementById(field.dataset.hsNativeErrorId)
          : null;
        if (!node) {
          node = document.createElement("div");
          node.id = `hsNativeFieldError${++errorSequence}`;
          node.className = nativeErrorClass;
          node.dataset.hsNativeError = "true";
          node.hidden = true;
          field.insertAdjacentElement("afterend", node);
          field.dataset.hsNativeErrorId = node.id;
        }
        return upgradeErrorNode(node);
      }

      function linkField(field, errorNode, focusField = true) {
        if (!(field instanceof HTMLElement) || !field.matches("input, select, textarea, [contenteditable='true']")) return;
        field.setAttribute("aria-invalid", "true");
        const ids = new Set((field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
        ids.add(errorNode.id);
        field.setAttribute("aria-describedby", [...ids].join(" "));
        errorNode.dataset.hsErrorFor = fieldKey(field);
        if (!focusField || !field.isConnected) return;
        field.focus({ preventScroll: true });
        requestAnimationFrame(() => {
          if (!field.isConnected || document.activeElement !== field) return;
          field.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function clearField(field) {
        if (!(field instanceof HTMLElement) || field.getAttribute("aria-invalid") !== "true") return;
        field.removeAttribute("aria-invalid");
        const key = field.dataset.hsFeedbackKey || field.id || "";
        const ids = (field.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean);
        const kept = ids.filter(id => id !== liveId && document.getElementById(id)?.dataset.hsErrorFor !== key);
        if (kept.length) field.setAttribute("aria-describedby", kept.join(" "));
        else field.removeAttribute("aria-describedby");
        ids.forEach(id => {
          const node = document.getElementById(id);
          if (!node || node.dataset.hsErrorFor !== key) return;
          if (node.dataset.hsNativeError === "true") {
            if (field.dataset.hsNativeErrorId === node.id) delete field.dataset.hsNativeErrorId;
            node.remove();
            return;
          }
          node.textContent = "";
          node.classList.remove("show");
          if (node.hasAttribute("hidden")) node.hidden = true;
          delete node.dataset.hsErrorFor;
        });
      }

      function report(message, field = null, errorNode = null, focusField = true) {
        const live = ensureLiveRegion();
        const target = upgradeErrorNode(errorNode) || live;
        if (errorNode && message) {
          target.textContent = message;
          target.hidden = false;
          target.classList.add("show");
        }
        live.textContent = "";
        requestAnimationFrame(() => { live.textContent = message || "请检查表单内容。"; });
        if (field) linkField(field, target, focusField);
        return false;
      }

      window.HSFormFeedback = { report, clear: clearField, upgrade: upgradeErrorNode };
      ensureNativeErrorStyles();
      ensureLiveRegion();
      document.querySelectorAll(errorSelector).forEach(upgradeErrorNode);
      document.querySelectorAll(fieldSelector).forEach(upgradeFieldName);

      document.addEventListener("invalid", event => {
        const field = event.target;
        if (!(field instanceof HTMLElement)) return;
        const firstInvalid = field.form?.querySelector(":invalid");
        const error = ensureNativeError(field);
        report(
          field.validationMessage || "请检查此字段。",
          field,
          error,
          !firstInvalid || firstInvalid === field
        );
      }, true);

      ["input", "change"].forEach(type => {
        document.addEventListener(type, event => {
          const field = event.target;
          if (!(field instanceof HTMLElement)) return;
          if (field.matches("input, select, textarea") && field.willValidate && !field.validity.valid) return;
          clearField(field);
        }, true);
      });

      new MutationObserver(records => {
        records.forEach(record => {
          if (record.target instanceof HTMLElement) {
            const node = record.target.matches?.(errorSelector) ? record.target : record.target.closest?.(errorSelector);
            if (node) {
              upgradeErrorNode(node);
              if (node.textContent.trim() && !node.hidden) ensureLiveRegion().textContent = node.textContent.trim();
            }
          }
          record.addedNodes.forEach(added => {
            if (!(added instanceof HTMLElement)) return;
            if (added.matches(errorSelector)) upgradeErrorNode(added);
            added.querySelectorAll?.(errorSelector).forEach(upgradeErrorNode);
            if (added.matches(fieldSelector)) upgradeFieldName(added);
            added.querySelectorAll?.(fieldSelector).forEach(upgradeFieldName);
            const labelContainers = added.matches("label") ? [added] : Array.from(added.querySelectorAll?.("label") || []);
            labelContainers.forEach(label => label.closest(fieldContainerSelector)?.querySelectorAll(fieldSelector).forEach(upgradeFieldName));
          });
        });
      }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden"] });
    })();
  </script>

  const createIcons = ({
    icons = iconAndAliases,
    nameAttr = "data-lucide",
    attrs = {},
    root = document,
    inTemplates
  } = {}) => {
    if (!Object.values(icons).length) {
      throw new Error(
        "Please provide an icons object.\nIf you want to use all the icons you can import it like:\n `import { createIcons, icons } from 'lucide';\nlucide.createIcons({icons});`"
      );
    }
    if (typeof root === "undefined") {
      throw new Error("`createIcons()` only works in a browser environment.");
    }
    const elementsToReplace = Array.from(root.querySelectorAll(`[${nameAttr}]`));
    elementsToReplace.forEach((element) => replaceElement(element, { nameAttr, icons, attrs }));
    if (inTemplates) {
      const templates = Array.from(root.querySelectorAll("template"));
      templates.forEach(
        (template) => createIcons({
          icons,
          nameAttr,
          attrs,
          root: template.content,
          inTemplates
        })
      );
    }
    if (nameAttr === "data-lucide") {
      const deprecatedElements = root.querySelectorAll("[icon-name]");
      if (deprecatedElements.length > 0) {
        console.warn(
          "[Lucide] Some icons were found with the now deprecated icon-name attribute. These will still be replaced for backwards compatibility, but will no longer be supported in v1.0 and you should switch to data-lucide"
        );
        Array.from(deprecatedElements).forEach(
          (element) => replaceElement(element, { nameAttr: "icon-name", icons, attrs })
        );
      }
    }
  };

    .nav-button {

      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 36px;

      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: #d0d5dd;
      text-align: left;
    }

    .nav-button svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .nav-children .nav-button {

    .main {

      flex-direction: column;
      overflow-x: hidden;
    }

    .crumbs {

      white-space: nowrap;

      gap: 10px;

    .tenant-pill,

      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      background: var(--surface);
      white-space: nowrap;
      font-size: 13px;
    }

    .scope-pill {
      color: var(--cyan);
      border-color: rgba(14, 143, 147, 0.24);
      background: rgba(14, 143, 147, 0.08);
    }

    .avatar {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eef2ff;
      color: #0e42d2;
      font-weight: 700;
      font-size: 12px;
    }

    .content {
      padding: 20px 22px 28px;
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .content > * {
      min-width: 0;

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .page-head h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
    }

    .page-head p {
      margin: 5px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }

    .btn {
      height: var(--control-height);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    .btn:hover {
      border-color: var(--primary-hover);
      color: var(--primary);
      background: #f7f8fa;
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn.danger {
      border-color: rgba(207, 31, 31, 0.35);
      color: var(--danger);
    }

    .btn:disabled,
    .btn[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.52;
      border-color: var(--border);
      background: #f2f3f5;
      color: var(--text-tertiary);
    }

    .btn.icon {
      width: 32px;
      padding: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 86px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      gap: 8px;
    }

    .metric .label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 12px;
      min-width: 0;
    }

    .metric .value {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
    }

    .metric .sub {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      min-width: 0;
    }

    .panel-title svg {
      width: 17px;
      height: 17px;
      color: var(--primary);
    }

    .segment {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #f2f3f5;
      overflow-x: auto;
      max-width: 100%;
    }

    .seg-btn {
      min-height: 28px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 10px;
      color: var(--text-secondary);
      background: transparent;
      white-space: nowrap;
      font-size: 12px;
    }

    .seg-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr repeat(5, minmax(132px, 1fr));
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #f7f8fa;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .input,
    .select {
      height: var(--control-height);
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      outline: none;
      min-width: 0;
    }

    .input:focus,
    .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(20, 95, 232, 0.14);
    }

    .input.is-invalid,
    .select.is-invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px rgba(207, 31, 31, 0.1);
    }

    .field-error {
      grid-column: 1 / -1;
      display: none;
      color: var(--danger);
      background: rgba(207, 31, 31, 0.07);
      border: 1px solid rgba(207, 31, 31, 0.18);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .field-error.show {
      display: block;
    }

    .input[readonly] {
      background: #f7f8fa;
      color: var(--text-secondary);
      cursor: default;
    }

    .table-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .selection-info {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
      min-width: 0;
    }

    table {
      width: 100%;
      min-width: 1540px;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: #f7f8fa;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);

      min-height: var(--table-row-height);

      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 12px;
    }

    tbody tr:hover td {
      background: #f7fbff;
    }

    .stack {

      gap: 3px;
      min-width: 0;
    }

    .stack strong {
      color: var(--text);
      font-weight: 600;
    }

    .muted {
      color: var(--text-tertiary);
    }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .money {
      text-align: right;
      font-family: var(--mono);
      font-weight: 500;
    }

    }

    .wallet-summary {

      gap: 5px;
      min-width: 252px;
    }

    .wallet-line {
      display: grid;

      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .wallet-label {
      color: var(--text-secondary);

    }

    .wallet-mini {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }

    .wallet-more {
      margin-top: 2px;
      justify-self: end;
    }

    .volume-cell {

      white-space: normal;
    }

    .volume-summary {
      display: grid;
      gap: 5px;
      min-width: 228px;
    }

    .volume-line {
      display: grid;
      grid-template-columns: 42px minmax(94px, 1fr) 52px;
      align-items: center;
      gap: 8px;
      line-height: 1.35;

    .volume-name {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .volume-amount {
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .volume-rate {

      text-align: right;
      white-space: nowrap;
    }

    .tag-row {

    .tag {

      align-items: center;

      min-height: 22px;
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .tag.blue {
      color: var(--primary);
      background: var(--primary-light);
      border-color: rgba(20, 95, 232, 0.18);
    }

    .tag.cyan {
      color: var(--cyan);
      background: rgba(14, 143, 147, 0.1);
      border-color: rgba(14, 143, 147, 0.18);
    }

    .tag.green {
      color: var(--success);
      background: rgba(0, 180, 42, 0.1);
      border-color: rgba(0, 180, 42, 0.18);
    }

    .tag.orange {
      color: var(--warning);
      background: rgba(255, 125, 0, 0.12);
      border-color: rgba(255, 125, 0, 0.2);
    }

    .tag.red {
      color: var(--danger);
      background: rgba(207, 31, 31, 0.1);
      border-color: rgba(207, 31, 31, 0.18);
    }

    .tag.purple {
      color: var(--purple);
      background: rgba(114, 46, 209, 0.1);
      border-color: rgba(114, 46, 209, 0.18);
    }

    .tag.disabled {
      color: var(--text-tertiary);
      background: #f2f3f5;
      border-color: var(--border);
    }

      gap: 6px;
      min-width: 248px;

    .capability-line {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      gap: 8px;
    }

    .capability-kind {

      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

      gap: 5px;
      flex-wrap: wrap;
    }

    .ops {

      align-items: center;
      gap: 8px;
    }

    .link-btn {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--primary);
      font-size: 13px;
    }

    .link-btn.danger-text {

    }

    .risk-bar {

      height: 6px;
      border-radius: var(--radius-sm);
      background: #edf1f7;
      overflow: hidden;
    }

    .risk-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--success);
    }

    .risk-fill.warn {
      background: var(--warning);
    }

    .risk-fill.danger {
      background: var(--danger);
    }

    .page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-width: 0;

    .page-grid td {

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      min-width: 0;
    }

    .rate-table td:last-child {

      box-shadow: -1px 0 0 var(--border);

    }

    .rate-table tbody tr:hover td:last-child {

    }

    .tier-summary {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .tier-pill {
      display: grid;
      grid-template-columns: minmax(110px, 0.8fr) 28px minmax(110px, 1fr);
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #f7f8fa;
      font-size: 13px;
    }

    .tier-pill .arrow {
      color: var(--text-tertiary);
      text-align: center;
    }

    .queue-list {
      display: grid;
      gap: 10px;
      padding: 12px 14px;
    }

    .queue-item {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #f7f8fa;
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .queue-item strong {
      overflow-wrap: anywhere;
    }

      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .audit-step {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .audit-dot {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f3ff;
      color: #0e42d2;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }

    .audit-step.done .audit-dot {
      background: rgba(0, 180, 42, 0.12);
      color: var(--success);
    }

    .audit-step.warn .audit-dot {
      background: rgba(255, 125, 0, 0.12);
      color: var(--warning);
    }

    .amount-strong {
      display: block;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--text);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 40, 0.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
      z-index: 20;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(960px, calc(100vw - 48px));
      max-height: calc(100vh - 64px);
      background: var(--surface);
      box-shadow: var(--shadow-modal);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.98);
      transition: opacity 0.16s ease, transform 0.18s ease;
      z-index: 21;
      display: flex;
      flex-direction: column;
    }

    .modal.small-modal {
      width: min(680px, calc(100vw - 48px));
    }

    .modal-mask.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 20px;
      line-height: 1.3;
    }

    .modal-head p {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .modal-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .modal-tab {
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .modal-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .modal-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

      align-items: center;
      justify-content: flex-end;

      padding: 12px 18px;

      background: var(--surface);

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .info-item {
      min-height: 64px;

      border-radius: var(--radius);
      background: #f7f8fa;

      font-size: 12px;

    .info-item .v {

      overflow-wrap: anywhere;

      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);

      font-size: 14px;
      border-bottom: 1px solid var(--border);
      background: #f7f8fa;

    .sub-panel-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function parseCnyInput(value, { allowZero = false } = {}) {
      const text = String(value ?? "").trim();
      if (!/^\d+(?:\.\d{1,2})?$/.test(text)) return null;
      const amount = Number(text);
      const cents = Math.round(amount * 100);
      if (!Number.isFinite(amount) || !Number.isSafeInteger(cents)) return null;
      if (allowZero ? amount < 0 : amount <= 0) return null;
      return amount;
    }

    function nowText() {
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date()).replaceAll("/", "-");
    }

    function clearInlineError(container = document.getElementById("modal")) {
      container?.querySelectorAll(".is-invalid").forEach((field) => field.classList.remove("is-invalid"));
      container?.querySelectorAll('[aria-invalid="true"]').forEach((field) => window.HSFormFeedback?.clear(field));
      container?.querySelectorAll(".field-error").forEach((error) => {
        error.textContent = "";
        error.classList.remove("show");
      });
    }

    function showInlineError(message, fieldId, errorId = "modalError") {
      const error = document.getElementById(errorId);
      if (error) {
        error.textContent = message;
        error.classList.add("show");
      }
      const field = fieldId ? document.getElementById(fieldId) : null;
      if (field) {
        field.classList.add("is-invalid");
      }
      const target = field || document.getElementById("modal")?.querySelector("input, select, textarea");
      window.HSFormFeedback?.report(message, target, error);
      return false;
    }

    function isPublicHttpsUrl(value) {
      if (!value) return true;
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();
        if (url.protocol !== "https:") return false;
        if (["localhost", "0.0.0.0", "::1"].includes(host)) return false;
        if (/^(10\.|127\.|169\.254\.|192\.168\.)/.test(host)) return false;
        const match = host.match(/^172\.(\d+)\./);
        if (match && Number(match[1]) >= 16 && Number(match[1]) <= 31) return false;
        return true;
      } catch {
        return false;
      }
    }

    function isForbiddenIpv4(address) {
      const parts = address.split(".").map(Number);

          || businessView === "提款钱包";
        return byKeyword && byType && byStatus && byCapability && byView;
      }).sort((a, b) => a.id.localeCompare(b.id));
    }

    function renderRows() {
      const list = filteredMerchants();
      const selectedCount = selectedMerchantIds.size;
      document.getElementById("resultInfo").textContent = selectedCount ? `共 ${list.length} 个商户，已选 ${selectedCount} 个` : `共 ${list.length} 个商户`;
      document.getElementById("merchantRows").innerHTML = list.map((item) => {
        const parent = item.parentMerchantId ? merchants.find((merchant) => merchant.id === item.parentMerchantId) : null;
        const childCount = merchants.filter((merchant) => merchant.parentMerchantId === item.id).length;
        const relation = item.type === "主商户"
          ? `直属子商户 ${childCount} 个`
          : item.type === "子商户"
            ? `上级：${parent ? parent.name : "未关联"}`
            : "无上级关系";
        return `
          <tr>
            <td><label class="table-check"><input type="checkbox" data-merchant-select="${item.id}" aria-label="选择 ${item.name}" ${selectedMerchantIds.has(item.id) ? "checked" : ""}></label></td>
            <td>
              <div class="stack">
                <strong>${item.name}</strong>
                <span class="mono muted">${item.id}</span>
                <span class="muted">${item.owner} · ${item.phone}</span>
              </div>
            </td>
            <td>
              <div class="stack">
                ${tag(item.type)}
                <span class="muted">${relation}</span>
              </div>
            </td>
            <td>${renderCapabilityMatrix(item)}</td>
            <td class="volume-cell">${renderVolumeSummary(item)}</td>
            <td>
              <div class="tag-row">
                ${tag(item.status)}
              </div>
            </td>
            <td class="wallet-cell">${renderWalletSummary(item)}</td>
            <td class="mono">${item.created}</td>
            <td>
              <div class="ops">
                <button class="link-btn" type="button" data-detail="${item.id}">详情</button>
                <button class="link-btn ${item.status === "停用" ? "" : "danger-text"}" type="button" data-merchant-toggle="${item.id}">${item.status === "停用" ? "启用" : "停用"}</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
      const visibleIds = list.map((item) => item.id);
      const visibleSelected = visibleIds.filter((id) => selectedMerchantIds.has(id)).length;
      const selectAll = document.getElementById("selectAllMerchants");
      if (selectAll) {
        selectAll.checked = visibleIds.length > 0 && visibleSelected === visibleIds.length;
        selectAll.indeterminate = visibleSelected > 0 && visibleSelected < visibleIds.length;
      }
      const batchButton = document.getElementById("batchToggleBtn");
      if (batchButton) batchButton.disabled = selectedCount === 0;
      if (window.lucide) window.lucide.createIcons();
    }

    function openMerchantStatusModal(ids, defaultAction = "") {
      const targets = ids.map((id) => merchants.find((item) => item.id === id)).filter(Boolean);
      if (!targets.length) {
        showToast("请先选择至少一个商户");
        return;
      }
      const inferredAction = targets.every((item) => item.status === "停用") ? "启用" : "停用";
      const action = defaultAction || inferredAction;
      document.getElementById("modal").innerHTML = `
        <div class="modal-head" data-astryx="DialogHeader">
          <div><h2>${targets.length > 1 ? "批量启停商户" : `${action}商户`}</h2><p>停用会阻止后续登录和新申请，历史与在途继续保留；启用会恢复后续登录和新申请。提交后逐笔记录永久审计日志。</p></div>
          <button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" data-astryx="DialogBody">
          <div class="form-grid">
            <div class="field">
              <label for="merchantStatusAction">目标状态</label>
              <select class="select" id="merchantStatusAction">
                <option value="停用" ${action === "停用" ? "selected" : ""}>停用</option>
                <option value="启用" ${action === "启用" ? "selected" : ""}>启用</option>
              </select>
            </div>
            <div class="field wide">
              <label for="merchantStatusReason">操作原因</label>
              <textarea class="input" id="merchantStatusReason" rows="3" placeholder="必填，将写入永久审计日志"></textarea>
            </div>
          </div>
          <div class="sub-panel" data-astryx="DataPanel">
            <h3>影响商户（${targets.length}）</h3>
            <div style="padding:12px" class="stack">${targets.map((item) => `<span><strong>${item.name}</strong> <span class="mono muted">${item.id}</span> · 当前 ${tag(item.status)}</span>`).join("")}</div>
          </div>
          <p class="muted">已有相同目标状态的商户会跳过，不重复写入状态变更。</p>
        </div>
        <div class="modal-footer" data-astryx="FooterActions">
          <button class="btn" type="button" id="merchantStatusCancel">取消</button>
          <button class="btn ${action === "停用" ? "danger" : "primary"}" type="button" id="merchantStatusConfirm">确认${action}</button>
        </div>
      `;
      showModal("small");
      bindModalEvents();
      document.getElementById("merchantStatusCancel").addEventListener("click", closeModal);
      document.getElementById("merchantStatusAction").addEventListener("change", (event) => {
        const confirm = document.getElementById("merchantStatusConfirm");
        confirm.textContent = `确认${event.target.value}`;
        confirm.className = `btn ${event.target.value === "停用" ? "danger" : "primary"}`;
      });
      document.getElementById("merchantStatusConfirm").addEventListener("click", () => applyMerchantStatus(targets));
    }

    function applyMerchantStatus(targets) {
      const action = document.getElementById("merchantStatusAction").value;
      const reason = document.getElementById("merchantStatusReason").value.trim();
      if (!reason) {
        showToast("请填写操作原因");
        document.getElementById("merchantStatusReason").focus();
        return;
      }
      const nextStatus = action === "启用" ? "正常" : "停用";
      const results = targets.map((item) => {
        if (item.status === nextStatus) return { item, result: "已跳过", detail: `当前已是${nextStatus}` };
        const previous = item.status;
        item.status = nextStatus;
        return { item, result: "成功", detail: `${previous} → ${nextStatus}` };
      });
      selectedMerchantIds.clear();
      renderRows();
      openMerchantStatusResult(results, reason);
    }

    function openMerchantStatusResult(results, reason) {
      const successCount = results.filter((row) => row.result === "成功").length;
      const skippedCount = results.length - successCount;
      document.getElementById("modal").innerHTML = `
        <div class="modal-head" data-astryx="DialogHeader">
          <div><h2>商户状态处理结果</h2><p>成功 ${successCount} 笔，跳过 ${skippedCount} 笔；每笔结果已写入永久审计日志。</p></div>
          <button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" data-astryx="DialogBody">
          ${dataTable(["商户", "结果", "状态变化"], results.map(({item, result, detail}) => [
            `<strong>${item.name}</strong><br><span class="mono muted">${item.id}</span>`, tag(result, result === "成功" ? "success" : "warning"), detail
          ]))}
          <p class="notice">停用成功后，该商户的新登录和新申请立即被拒绝，历史订单、钱包、流水、审计和在途业务继续保留；启用成功后只恢复之后的登录和新申请。</p>
          <p class="muted">操作原因：${reason}</p>
        </div>
        <div class="modal-footer" data-astryx="FooterActions"><button class="btn primary" type="button" id="merchantStatusDone">完成</button></div>
      `;
      showModal();
      bindModalEvents();
      document.getElementById("merchantStatusDone").addEventListener("click", closeModal);
    }

    const modulePages = {
      "merchant-funding": {
        title: "商户资金申请",
        desc: "商户发起外部存款、提款、人工加款或人工扣款，租户审核；只有提款通过后形成租户代付请求，平台不参与商户钱包。",
        custom: "funding"
      },
      "merchant-rate": {
        title: "商户费率",
        desc: "维护当前租户的商户提款、代收和代付费率配置。",
        custom: "rate"
      }
    };

    function filterGrid(filters) {
      return `<div class="filters" data-astryx="FilterForm">${filters.map(([label, config]) => `
        <div class="field">
          <label>${label}</label>
          ${Array.isArray(config)
            ? `<select class="select">${config.map((option) => `<option>${option}</option>`).join("")}</select>`
            : `<input class="input" placeholder="${config}">`}
        </div>
      `).join("")}</div>`;
    }

    function dataTable(columns, rows, emptyText = "当前筛选下暂无记录") {
      return `<div class="table-wrap" data-astryx="DataTable">
        <table data-astryx="Table">
          <thead><tr>${columns.map((col) => `<th>${col}</th>`).join("")}</tr></thead>
          <tbody>${rows.length ? rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${columns.length}"><div class="empty-state">${escapeHtml(emptyText)}</div></td></tr>`}</tbody>
        </table>
      </div>`;
    }

    function num(value) {
      return Number(String(value).replace(/,/g, ""));
    }

    const fundingFilters = {
      identifier: "",
      merchantKeyword: "",
      tenantPayoutNo: "",
      type: "全部类型",
      wallet: "全部钱包",
      reviewStatus: "全部审核状态",
      ledgerStatus: "全部账务状态",
      platformStatus: "全部平台状态",
      minAmount: "",
      maxAmount: "",
      start: "",
      end: ""
    };
    let fundingSourceContext = null;

    function fundingSelected(current, value) {
      return current === value ? " selected" : "";
    }

    function filteredFundingOrders() {
      const identifier = fundingFilters.identifier.trim().toLowerCase();
      const merchantKeyword = fundingFilters.merchantKeyword.trim().toLowerCase();
      const tenantPayoutNo = fundingFilters.tenantPayoutNo.trim().toLowerCase();
      const minAmount = fundingFilters.minAmount === "" ? Number.NEGATIVE_INFINITY : Number(fundingFilters.minAmount);
      const maxAmount = fundingFilters.maxAmount === "" ? Number.POSITIVE_INFINITY : Number(fundingFilters.maxAmount);
      return fundingOrders.filter((order) => {
        const applicationId = order.id.toLowerCase();
        const merchantRequestNo = String(order.merchantRequestNo || "").toLowerCase();
        const merchantSearchable = `${order.merchantId} ${order.merchantName}`.toLowerCase();
        const relatedTenantPayoutNo = String(order.tenantPayoutRequest || "").toLowerCase();
        const createdDate = order.created.slice(0, 10);
        const platformStatus = order.type === "提款" ? order.platformStatus : "不适用";
        return (!identifier || applicationId === identifier || merchantRequestNo === identifier)
          && (!merchantKeyword || merchantSearchable.includes(merchantKeyword))
          && (!tenantPayoutNo || (order.type === "提款" && relatedTenantPayoutNo === tenantPayoutNo))
          && (fundingFilters.type === "全部类型" || order.type === fundingFilters.type)
          && (fundingFilters.wallet === "全部钱包" || order.wallet === fundingFilters.wallet)
          && (fundingFilters.reviewStatus === "全部审核状态" || order.reviewStatus === fundingFilters.reviewStatus)
          && (fundingFilters.ledgerStatus === "全部账务状态" || order.ledgerStatus === fundingFilters.ledgerStatus)
          && (fundingFilters.platformStatus === "全部平台状态" || platformStatus === fundingFilters.platformStatus)
          && num(order.amount) >= minAmount
          && num(order.amount) <= maxAmount
          && (!fundingFilters.start || createdDate >= fundingFilters.start)
          && (!fundingFilters.end || createdDate <= fundingFilters.end);
      });
    }

    function fundingRows(orders) {
      return orders.map((order) => {
        const requestType = order.type || "提款";
        const canReview = order.reviewStatus === "待租户审核";
        const action = canReview
            ? `<button class="link-btn" type="button" data-funding-review="${order.id}">审核</button>`
            : "";
        const ledgerResult = order.ledgerCorrelation
          ? `<button class="link-btn" type="button" data-funding-ledger="${order.id}">${tag(order.ledgerStatus)}</button><br><span class="mono muted">${order.ledgerIds?.length ? order.ledgerIds.join(" / ") : (order.ledgerNo || order.ledgerCorrelation)}</span>${order.ledgerNo ? `<br><span class="mono muted">${order.ledgerCorrelation}</span>` : ""}`
          : `${tag(order.ledgerStatus)}<br><span class="muted">未形成流水</span>`;
        const platformExecution = requestType === "提款"
          ? `<span class="mono">${order.tenantPayoutRequest || "未建立租户代付"}</span><br><span class="mono muted">${order.platformOrder}</span><br><span class="muted">${order.platformStatus}</span>`
          : `<span class="muted">不适用</span>`;
        return [
          `<span class="mono">${order.id}</span><br><span class="mono muted">商户请求 ${order.merchantRequestNo || "缺失"}</span><br><span class="muted">${order.owner} 提交</span>`,
          `<strong>${order.merchantName}</strong><br><span class="mono muted">${order.merchantId}</span>`,
          `${tag(requestType)}<br><span class="muted">${order.wallet}</span>`,
          `<span class="amount-strong">${order.asset} ${order.amount}</span><br><span class="muted">手续费 ${order.asset} ${order.fee}</span>`,
          `${tag(order.reviewStatus)}<br><span class="muted">${order.reviewer === "-" ? "尚未审核" : `${order.reviewer} · ${order.reviewedAt}`}</span>`,
          ledgerResult,
          platformExecution,
          `<span class="mono">${order.created}</span>`,
          `<div class="ops"><button class="link-btn" type="button" data-funding-detail="${order.id}">详情</button>${action}</div>`
        ];
      });
    }

    function renderMerchantFundingPage(config) {
      const visibleOrders = filteredFundingOrders();
      updateCrumbs(config.title);
      setActiveNav("merchant-funding");
      document.querySelector(".content").innerHTML = `
        <div class="page-head" data-astryx="PageHeader">
          <div>
            <h1>${config.title}</h1>
            <p>${config.desc}</p>
          </div>
        </div>
        <section class="panel" data-astryx="DataPanel">
          <div class="panel-head" data-astryx="PanelHeader">
            <div class="panel-title"><i data-lucide="sliders-horizontal"></i>资金申请筛选</div>
            <div class="selection-info">当前租户：HS-TEN-001 汇盛东南亚</div>
          </div>
          ${fundingSourceContext ? `<div class="notice" data-funding-source-context>来源：商户详情 / ${escapeHtml(fundingSourceContext.merchantName)}（${escapeHtml(fundingSourceContext.merchantId)}）/ ${escapeHtml(fundingSourceContext.wallet)}；已立即应用商户与钱包筛选，可点击“重置”查看当前租户全部记录。</div>` : ""}
          <div class="filters" data-astryx="FilterForm">
            <div class="field"><label for="tenantFundingIdentifier">申请编号 / 商户请求号</label><input class="input" id="tenantFundingIdentifier" value="${escapeHtml(fundingFilters.identifier)}" placeholder="输入任一完整编号"></div>
            <div class="field"><label for="tenantFundingMerchant">商户</label><input class="input" id="tenantFundingMerchant" value="${escapeHtml(fundingFilters.merchantKeyword)}" placeholder="商户名称 / 编号"></div>
            <div class="field"><label for="tenantFundingPayoutNo">关联租户代付编号</label><input class="input" id="tenantFundingPayoutNo" value="${escapeHtml(fundingFilters.tenantPayoutNo)}" placeholder="仅提款，输入完整编号"></div>
            <div class="field"><label for="tenantFundingType">申请类型</label><select class="select" id="tenantFundingType">${["全部类型", "外部存款", "提款", "人工加款", "人工扣款"].map((value) => `<option${fundingSelected(fundingFilters.type, value)}>${value}</option>`).join("")}</select></div>
            <div class="field"><label for="tenantFundingWallet">目标钱包</label><select class="select" id="tenantFundingWallet">${["全部钱包", "代收钱包", "代付钱包", "提款钱包"].map((value) => `<option${fundingSelected(fundingFilters.wallet, value)}>${value}</option>`).join("")}</select></div>
            <div class="field"><label for="tenantFundingReview">租户审核</label><select class="select" id="tenantFundingReview">${["全部审核状态", "待租户审核", "已通过", "已驳回", "已撤回"].map((value) => `<option${fundingSelected(fundingFilters.reviewStatus, value)}>${value}</option>`).join("")}</select></div>
            <div class="field"><label for="tenantFundingLedger">商户账务</label><select class="select" id="tenantFundingLedger">${["全部账务状态", "尚未形成", "已冻结", "已记账", "已出账", "已释放", "账务异常"].map((value) => `<option${fundingSelected(fundingFilters.ledgerStatus, value)}>${value}</option>`).join("")}</select></div>
            <div class="field"><label for="tenantFundingPlatform">提款平台状态</label><select class="select" id="tenantFundingPlatform">${["全部平台状态", "不适用", "未受理", "待提交通道", "处理中", "成功", "失败", "已取消", "异常待处理"].map((value) => `<option${fundingSelected(fundingFilters.platformStatus, value)}>${value}</option>`).join("")}</select></div>
            <div class="field"><label for="tenantFundingMin">最小金额（CNY）</label><input class="input" id="tenantFundingMin" type="number" min="0" step="0.01" value="${escapeHtml(fundingFilters.minAmount)}"></div>
            <div class="field"><label for="tenantFundingMax">最大金额（CNY）</label><input class="input" id="tenantFundingMax" type="number" min="0" step="0.01" value="${escapeHtml(fundingFilters.maxAmount)}"></div>
            <div class="field"><label for="tenantFundingStart">开始日期（UTC+8）</label><input class="input" id="tenantFundingStart" type="date" value="${escapeHtml(fundingFilters.start)}"></div>
            <div class="field"><label for="tenantFundingEnd">结束日期（UTC+8）</label><input class="input" id="tenantFundingEnd" type="date" value="${escapeHtml(fundingFilters.end)}"></div>
          </div>
          <div class="table-actions" data-astryx="ActionToolbar">
            <div class="selection-info">当前搜索结果 ${visibleOrders.length} 笔 · 业务总计 ${fundingOrders.length} 笔；只有提款审核通过后生成租户代付单</div>
            <div class="toolbar"><button class="btn" type="button" id="tenantFundingReset">重置</button><button class="btn primary" type="button" id="tenantFundingQuery">查询</button></div>
          </div>
          ${dataTable(["申请编号 / 商户请求号", "商户", "类型 / 钱包", "申请金额 / 手续费", "租户审核", "商户账务结果", "平台执行", "创建时间", "操作"], fundingRows(visibleOrders), "当前筛选下没有商户资金申请，请调整编号、商户、钱包、审核、账务、金额或时间条件。")}
        </section>
      `;
      bindFundingEvents();
      bindToastButtons();
      if (window.lucide) window.lucide.createIcons();
    }

    function bindFundingEvents() {
      document.querySelectorAll("[data-funding-detail]").forEach((btn) => {
        btn.addEventListener("click", () => openFundingDetailModal(btn.dataset.fundingDetail, "detail"));
      });
      document.querySelectorAll("[data-funding-review]").forEach((btn) => {
        btn.addEventListener("click", () => openFundingDetailModal(btn.dataset.fundingReview, "review"));
      });
      document.querySelectorAll("[data-funding-ledger]").forEach((btn) => {
        btn.addEventListener("click", () => openFundingLedgerModal(btn.dataset.fundingLedger));
      });
      document.getElementById("tenantFundingQuery")?.addEventListener("click", applyTenantFundingFilters);
      document.getElementById("tenantFundingReset")?.addEventListener("click", resetTenantFundingFilters);
    }

    function applyTenantFundingFilters() {
      const minAmount = document.getElementById("tenantFundingMin").value;
      const maxAmount = document.getElementById("tenantFundingMax").value;
      const start = document.getElementById("tenantFundingStart").value;
      const end = document.getElementById("tenantFundingEnd").value;
      if (minAmount !== "" && Number(minAmount) < 0) return showToast("最小金额不能小于 0");
      if (maxAmount !== "" && Number(maxAmount) < 0) return showToast("最大金额不能小于 0");
      if (minAmount !== "" && maxAmount !== "" && Number(minAmount) > Number(maxAmount)) return showToast("最小金额不能大于最大金额");
      if (start && end && start > end) return showToast("开始日期不能晚于结束日期");
      Object.assign(fundingFilters, {
        identifier: document.getElementById("tenantFundingIdentifier").value,
        merchantKeyword: document.getElementById("tenantFundingMerchant").value,
        tenantPayoutNo: document.getElementById("tenantFundingPayoutNo").value,
        type: document.getElementById("tenantFundingType").value,
        wallet: document.getElementById("tenantFundingWallet").value,
        reviewStatus: document.getElementById("tenantFundingReview").value,
        ledgerStatus: document.getElementById("tenantFundingLedger").value,
        platformStatus: document.getElementById("tenantFundingPlatform").value,
        minAmount,
        maxAmount,
        start,
        end
      });
      renderMerchantFundingPage(modulePages["merchant-funding"]);
      showToast("已按当前租户范围刷新商户资金申请；审核、账务与提款平台状态分别筛选");
    }

    function resetTenantFundingFilters() {
      Object.assign(fundingFilters, {
        identifier: "",
        merchantKeyword: "",
        tenantPayoutNo: "",
        type: "全部类型",
        wallet: "全部钱包",
        reviewStatus: "全部审核状态",
        ledgerStatus: "全部账务状态",
        platformStatus: "全部平台状态",
        minAmount: "",
        maxAmount: "",
        start: "",
        end: ""
      });
      fundingSourceContext = null;
      renderMerchantFundingPage(modulePages["merchant-funding"]);
      showToast("筛选已重置，仍只显示当前租户的商户资金申请");
    }

    function openMerchantFundingHistory(merchantId, wallet) {
      const merchant = merchants.find((item) => item.id === merchantId);
      if (!merchant || !["代收钱包", "代付钱包", "提款钱包"].includes(wallet)) {
        showToast("无法定位商户或钱包，请刷新后重试");
        return;
      }
      Object.assign(fundingFilters, {
        identifier: "",
        merchantKeyword: merchantId,
        tenantPayoutNo: "",
        type: "全部类型",
        wallet,
        reviewStatus: "全部审核状态",
        ledgerStatus: "全部账务状态",
        platformStatus: "全部平台状态",
        minAmount: "",
        maxAmount: "",
        start: "",
        end: ""
      });
      fundingSourceContext = { merchantId, merchantName: merchant.name, wallet };
      closeModal();
      renderMerchantFundingPage(modulePages["merchant-funding"]);
      window.history.replaceState(null, "", "#merchant-funding");
      showToast(`已进入 ${merchant.name} ${wallet}资金申请记录，共 ${filteredFundingOrders().length} 笔`);

    function refreshFundingPlatformStatus(orderId) {
      const order = fundingOrders.find((item) => item.id === orderId);
      if (!order || order.type !== "提款" || !order.platformOrder || order.platformOrder === "-") {
        showToast("当前申请尚未形成可查询的平台代付单");
        return;
      }
      order.platformCheckedAt = nowText();
      openFundingDetailModal(orderId, "detail");
      showToast(`平台状态查询完成：${order.platformStatus}`);
    }

    function openFundingLedgerModal(orderId) {
      const order = fundingOrders.find((item) => item.id === orderId);
      if (!order?.ledgerCorrelation) {
        showToast("当前申请尚未形成商户钱包流水");
        return;
      }
      const isFixedWithdrawalSuccess = order.id === "WD-M-0715-0172" && order.platformStatus === "成功";
      const movement = isFixedWithdrawalSuccess
        ? "原冻结转出账：净额 CNY 49,950.00 + 提款手续费 CNY 50.00"
        : order.ledgerStatus === "已记账"
        ? `${order.type === "人工扣款" ? "支出" : "收入"} CNY ${order.amount}`
        : order.ledgerStatus === "已冻结"
          ? `冻结 CNY ${order.amount}`
          : order.ledgerStatus === "已出账"
            ? `从冻结出账 CNY ${order.amount}`
            : order.ledgerStatus === "已释放"
              ? `释放本申请冻结 CNY ${order.amount}`
              : `账务状态 ${order.ledgerStatus}`;

        <div class="modal-head"><div><h2>商户钱包流水详情</h2><p><span class="mono">${order.ledgerNo || order.ledgerCorrelation}</span> · 来源申请 ${order.id}</p></div><button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button></div>

    function validateFundingReview(order, { checkWallet = false } = {}) {
      if (!order || order.reviewStatus !== "待租户审核") {
        showToast("申请状态已变化，请刷新后重新处理");
        return false;
      }
      if (order.owner === currentTenantOperator.account) {
        showToast("申请人不能审核自己的申请，请由另一名有权限账号处理");
        return false;
      }
      const expectedVersion = Number(document.getElementById("modal").dataset.fundingExpectedVersion);
      if (order.entityVersion !== expectedVersion) {
        const field = document.getElementById("fundingReviewTwoFa");
        if (field) field.value = "";
        showToast("申请版本已变化，本次审核未提交，请刷新后重新核对");
        return false;
      }
      if (checkWallet) {
        const expectedWalletVersion = Number(document.getElementById("modal").dataset.fundingExpectedWalletVersion);
        const currentWalletVersion = order.walletVersion ?? order.entityVersion;
        if (currentWalletVersion !== expectedWalletVersion) {
          const field = document.getElementById("fundingReviewTwoFa");
          if (field) field.value = "";
          showToast("商户钱包版本已变化，本次审核未提交，请刷新余额后重新核对");
          return false;
        }
      }
      const twoFa = document.getElementById("fundingReviewTwoFa")?.value.trim() || "";
      if (twoFa !== currentTenantOperator.google2fa) {
        showToast("请输入正确的 6 位 Google 2FA 验证码");
        document.getElementById("fundingReviewTwoFa")?.focus();
        return false;
      }
      return true;
    }

    function approveFunding(orderId) {
      const order = fundingOrders.find((item) => item.id === orderId);
      if (!validateFundingReview(order, { checkWallet: true })) return;
      if (order.type === "人工扣款" && num(order.amount) > num(order.before)) {
        showToast(`商户${order.wallet}可用余额不足：当前 CNY ${order.before}，申请扣款 CNY ${order.amount}`);
        return;
      }
      if (order.type === "提款") {
        const channelId = document.getElementById("fundingChannel")?.value;
        if (!channelId) {
          showToast("请选择已授权的 CNY 代付通道");
          document.getElementById("fundingChannel")?.focus();
          return;
        }
        const channel = selectableFundingPayoutChannel(order, channelId);
        if (!channel) {
          const twoFa = document.getElementById("fundingReviewTwoFa");
          if (twoFa) twoFa.value = "";
          showInlineError("通道授权或运行状态已变化，本次审核未提交；请刷新后从当前可接新单的授权通道中重新选择。", "fundingChannel", "fundingChannelError");
          return;
        }
        order.status = "待平台受理";
        order.reviewStatus = "已通过";
        order.reviewer = currentTenantOperator.account;
        order.reviewedAt = nowText();
        order.ledgerStatus = "已冻结";
        order.ledgerCorrelation = `MLC-${order.id.replace(/\D/g, "")}`;
        order.frozen = order.amount;
        order.after = fmt.format(Math.max(0, num(order.before) - num(order.amount)));
        order.walletVersion = (order.walletVersion ?? order.entityVersion) + 1;
        order.entityVersion += 1;
        order.tenantPayoutRequest = `TPO-DEMO-${order.id.replace(/[^A-Z0-9]/gi, "").slice(-10)}`;
        order.platformOrder = `PO-CNY-DEMO-${order.id.slice(-4)}`;
        order.platformStatus = "待提交通道";
        order.selectedChannelId = channel.id;
        order.selectedChannelName = channel.name;
        order.selectedChannelStatusSnapshot = channel.status;
        order.selectedChannelProductId = channel.productMode === "无产品层" ? "" : channel.productId;
        order.reason = `租户审核通过，已按授权快照 ${order.businessGrantVersion} 人工选择 ${channel.name}（${channel.id}）并提交平台；等待平台校验`;
      } else {
        order.status = "已通过";
        order.reviewStatus = "已通过";
        order.reviewer = currentTenantOperator.account;
        order.reviewedAt = nowText();
        order.ledgerStatus = "已记账";
        order.ledgerCorrelation = `MLC-${order.id.replace(/\D/g, "")}`;
        order.after = fmt.format(order.type === "人工扣款" ? num(order.before) - num(order.amount) : num(order.before) + num(order.amount));

        order.entityVersion += 1;
        order.reason = "租户审核通过，商户钱包已生成独立处理流水；平台不参与";
      }

    function rejectFunding(orderId) {
      const order = fundingOrders.find((item) => item.id === orderId);
      if (!validateFundingReview(order)) return;
      const category = document.getElementById("fundingRejectCategory")?.value;
      const reason = document.getElementById("fundingReviewReason")?.value.trim();
      if (!category || !reason) {
        showToast("驳回时请选择分类并填写具体说明");
        (!category ? document.getElementById("fundingRejectCategory") : document.getElementById("fundingReviewReason"))?.focus();
        return;
      }
      order.status = "已驳回";
      order.reviewStatus = "已驳回";
      order.reviewer = currentTenantOperator.account;
      order.reviewedAt = nowText();
      order.ledgerStatus = "尚未形成";
      order.ledgerCorrelation = "";
      order.entityVersion += 1;
      order.platformOrder = "-";

      order.reason = `${category}：${reason}`;

      closeModal();

    function bindTierEditorEvents() {
      document.querySelectorAll("[data-tier-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearInlineError();
          const rows = document.querySelectorAll("[data-tier-row]");
          if (rows.length <= 1) return showInlineError("商户提款费率至少保留一个档位。", null);
          btn.closest("[data-tier-row]").remove();
        });
      });
      document.getElementById("addTierRow")?.addEventListener("click", () => {
        clearInlineError();
        const starts = [...document.querySelectorAll("[data-tier-start]")].map((input) => parseCnyInput(input.value, { allowZero: true }));
        if (starts.some((start) => start === null)) return showInlineError("档位起始金额必须大于等于 0，且最多两位小数。", null);
        const nextStart = Math.max(...starts, 0) + 1000;
        const body = document.getElementById("tierEditorBody");
        body.insertAdjacentHTML("beforeend", tierEditorRow({ start: String(nextStart), fee: "CNY 1.00" }, body.children.length));
        bindTierEditorEvents();
      });
    }

    function readTierDraft() {
      const rows = [...document.querySelectorAll("[data-tier-row]")];
      if (!rows.length) {
        showInlineError("至少需要一个提款手续费档位。", null);
        return null;
      }
      const values = rows.map((row) => ({
        start: row.querySelector("[data-tier-start]").value.trim(),
        fee: row.querySelector("[data-tier-fee]").value.trim()
      }));
      for (let index = 0; index < values.length; index += 1) {
        const start = parseCnyInput(values[index].start, { allowZero: true });
        if (start === null) {
          showInlineError("档位起始金额必须大于等于 0，且最多两位小数。", null);
          return null;
        }
        values[index].amount = start;
        if (!/^(免费|CNY\s+\d+(?:\.\d{1,2})?)$/.test(values[index].fee)) {
          showInlineError("手续费请输入“CNY 1.00”格式或“免费”。", null);
          return null;
        }
      }
      values.sort((a, b) => a.amount - b.amount);
      if (values[0].amount !== 0) {
        showInlineError("第一个提款档位必须从 0 开始。", null);
        return null;
      }
      if (values.some((value, index) => index > 0 && value.amount === values[index - 1].amount)) {
        showInlineError("档位起始金额不能重复。", null);
        return null;
      }
      return values.map((value, index) => {
        const next = values[index + 1];
        const range = next ? `提款 [${value.amount}, ${next.amount})` : `提款 >= ${value.amount}`;
        return {
          start: String(value.amount),
          fee: value.fee,
          badge: index === 0 ? "起始档" : "",
          interval: value.fee === "免费" ? `${range} 免手续费` : `${range} 手续费 ${value.fee}`
        };
      });
    }

      const after = {
        ...item,

        chargeType: document.getElementById("rateChargeType").value,
        formula,
        minMax,
        wallet: document.getElementById("rateWallet").value,
        chargeTiming,
        note,
        status: "已启用"
      };
      openRateApplyConfirm({
        target: item,
        changeType: "编辑",
        before: { formula: item.formula, minMax: item.minMax, wallet: item.wallet, chargeTiming: item.chargeTiming, note: item.note },
        after,
        reason
      });
    }

    function nextRateVersion(item) {
      return `v${Number(String(item.version || "v1").replace("v", "")) + 1}`;
    }

    function openRateApplyConfirm(change) {
      const version = nextRateVersion(change.target);
      document.getElementById("modal").innerHTML = `
        <div class="modal-head"><div><h2>确认${change.changeType}统一费率</h2><p>${escapeHtml(change.target.business)} · CNY · ${change.target.id}</p></div><button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div class="notice">确认后立即生成 ${version} 并对之后创建的新订单生效；历史订单继续使用原费率快照。本次不会生成审核单。</div>
          ${dataTable(["变更前", "变更后", "变更原因"], [[change.before ? rateSnapshotSummary(change.before) : "无", rateSnapshotSummary(change.after), escapeHtml(change.reason)]])}
          <div class="info-grid"><div class="info-item"><div class="k">操作账号</div><div class="v">${escapeHtml(currentTenantOperator.account)}</div></div><div class="info-item"><div class="k">生效时区</div><div class="v">UTC+8</div></div><div class="info-item"><div class="k">影响范围</div><div class="v">当前租户全部商户的新订单</div></div><div class="info-item"><div class="k">审计</div><div class="v">前后值、原因、账号、IP、时间永久保存</div></div></div>
        </div>

      `;
      showModal();
      bindModalEvents();
      document.getElementById("rateApplyCancel").addEventListener("click", () => change.changeType === "编辑" ? openRateModal(change.target.id) : openRateStatusModal(change.target.id, change.changeType));
      document.getElementById("rateApplyConfirm").addEventListener("click", () => applyRateChange(change, version));
    }

    function applyRateChange(change, version) {
      const now = nowText();
      Object.assign(change.target, change.after, { version, effective: now, updated: `${now} ${currentTenantOperator.account}` });
      const id = `RATE-CHG-20260718-${String(rateChangeHistory.length + 1).padStart(3, "0")}`;
      rateChangeHistory.unshift({ id, targetId: change.target.id, changeType: change.changeType, business: change.target.business, before: change.before, after: change.after, operator: currentTenantOperator.account, version, status: "已生效", created: now, reason: change.reason });
      closeModal();
      renderMerchantRatePage(modulePages["merchant-rate"]);
      showToast(`${change.target.business}统一费率 ${version} 已生效；只影响之后创建的新订单，审计日志已永久保存`);
    }

          <div class="notice">${action === "停用" ? "停用后该业务的新订单会因没有可用统一费率而被阻断；已创建订单不受影响。" : "启用后该业务的新订单立即使用当前费率版本。"}</div>
          <div class="info-grid"><div class="info-item"><div class="k">当前状态</div><div class="v">${tag(item.status)}</div></div><div class="info-item"><div class="k">目标状态</div><div class="v">${tag(action === "停用" ? "已停用" : "已启用")}</div></div><div class="info-item"><div class="k">影响范围</div><div class="v">当前租户全部商户的新订单</div></div><div class="info-item"><div class="k">执行方式</div><div class="v">同一有权限账号二次确认后直接生效</div></div></div>

          <div class="field-error" id="modalError" role="alert"></div>

        <div class="modal-footer"><button class="btn" type="button" id="rateStatusCancel">取消</button><button class="btn ${action === "停用" ? "danger" : "primary"}" type="button" id="rateStatusContinue">继续确认</button></div>
      `;
      showModal("small");
      bindModalEvents();
      document.getElementById("rateStatusCancel").addEventListener("click", closeModal);

      const value = values.find((candidate) => candidate && !["待配置", "待补充", "待确认", "未配置", "未开通"].includes(candidate));
      return value || "";
    }

    function bindDetailPanelEvents(item) {
      const typeSelect = document.getElementById("merchantBasicType");
      typeSelect?.addEventListener("change", () => {
        const parentField = document.getElementById("merchantBasicParentField");
        parentField.hidden = typeSelect.value !== "子商户";
        if (parentField.hidden) document.getElementById("merchantBasicParent").value = "";
      });
      document.getElementById("saveMerchantBasic")?.addEventListener("click", () => saveMerchantBasic(item));
      document.querySelectorAll("[data-capability-toggle]").forEach((button) => {
        button.addEventListener("click", () => openCapabilityConfirm(item, button.dataset.capabilityToggle, button.dataset.capabilityAction));
      });
      document.querySelectorAll("[data-business-config-save]").forEach((button) => {
        button.addEventListener("click", () => saveMerchantBusinessConfig(item, button.dataset.businessConfigSave));
      });
      document.querySelectorAll("[data-product-config]").forEach((button) => {
        button.addEventListener("click", () => openCollectProductConfig(item));
      });
      document.querySelectorAll("[data-open-page]").forEach((button) => {
        button.addEventListener("click", () => {
          const pageKey = button.dataset.openPage;
          closeModal();
          window.history.replaceState(null, "", `#${pageKey}`);
          renderModulePage(pageKey);
          showToast("已进入商户统一费率配置页");
        });
      });
      document.querySelectorAll("[data-access-save]").forEach((button) => {
        button.addEventListener("click", () => validateAccessChange(item, button.dataset.accessSave));
      });
      document.querySelectorAll("[data-admin-reset]").forEach((button) => {
        button.addEventListener("click", () => validateAdminReset(item, button.dataset.adminReset));
      });
    }

    function saveMerchantBusinessConfig(item, mode) {
      clearInlineError();
      const isCollect = mode === "collect";
      const cfg = isCollect ? item.collectConfig : item.payoutConfig;
      const capability = isCollect ? "法币代收" : "法币代付";
      if (!item.capabilities.includes(capability)) return showInlineError(`当前商户未开通${capability}，请先在业务权限中开通。`);
      const statusId = isCollect ? "merchantCollectStatus" : "merchantPayoutStatus";
      const reasonId = isCollect ? "merchantCollectReason" : "merchantPayoutReason";
      const status = document.getElementById(statusId).value;
      const reason = document.getElementById(reasonId).value.trim();
      if (status === "未开通") return showInlineError("关闭业务能力请前往业务权限处理；业务配置不能直接改为未开通。", statusId);
      const next = isCollect ? { status } : {
        status,
        manualOrder: document.getElementById("merchantPayoutManual").value,
        rejectNotice: document.getElementById("merchantPayoutNotice").value
      };
      const changed = Object.entries(next).some(([key, value]) => cfg[key] !== value);
      if (!changed) return showInlineError("当前业务配置没有变化，无需重复保存。");
      if (!reason) return showInlineError("请填写配置变更原因。", reasonId);
      const button = document.querySelector(`[data-business-config-save="${mode}"]`);
      button.disabled = true;
      button.textContent = "保存中…";
      setTimeout(() => {
        const before = isCollect ? `状态 ${cfg.status}` : `状态 ${cfg.status} / 手动下单 ${cfg.manualOrder} / 驳回通知 ${cfg.rejectNotice}`;
        Object.assign(cfg, next);
        const after = isCollect ? `状态 ${cfg.status}` : `状态 ${cfg.status} / 手动下单 ${cfg.manualOrder} / 驳回通知 ${cfg.rejectNotice}`;
        item.logs.unshift([nowText(), `保存${isCollect ? "代收" : "代付"}配置`, currentTenantOperator.account, `${before} → ${after}；${reason}`]);
        renderDetailModal(item);
        showToast(`${isCollect ? "代收" : "代付"}配置已保存；只影响后续新订单`);
      }, 350);
    }

    function openCollectProductConfig(item) {
      const cfg = item.collectConfig;
      const currentNames = new Set(cfg.products.map((product) => product[0]));
      const available = ["银行卡转账", "CNY-快捷支付", "扫码收款"];
      document.getElementById("modal").innerHTML = `
        <div class="modal-head" data-astryx="DialogHeader">
          <div><h2>配置代收产品</h2><p>${escapeHtml(item.name)} · ${item.id} · CNY</p></div>
          <button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" data-astryx="DialogBody">
          <div class="check-row">
            ${available.map((name) => `<label class="check-card"><input type="checkbox" data-collect-product value="${name}" ${currentNames.has(name) ? "checked" : ""}>${name}</label>`).join("")}
          </div>
          <div class="notice">产品只作用于当前商户；商户费率仍使用当前租户统一费率，不在这里设置单商户费率。</div>
          <div class="field wide"><label for="collectProductReason">配置原因</label><input class="input" id="collectProductReason" placeholder="必填，将写入操作日志"></div>
          <div class="field-error" id="modalError" role="alert"></div>
        </div>
        <div class="modal-footer" data-astryx="FooterActions">
          <button class="btn" type="button" id="collectProductCancel">取消</button>
          <button class="btn primary" type="button" id="collectProductConfirm">保存产品</button>
        </div>
      `;
      showModal("small");
      bindModalEvents();
      document.getElementById("collectProductCancel").addEventListener("click", () => renderDetailModal(item));
      document.getElementById("collectProductConfirm").addEventListener("click", () => applyCollectProductConfig(item));
    }

    function applyCollectProductConfig(item) {
      clearInlineError();
      const names = [...document.querySelectorAll("[data-collect-product]:checked")].map((checkbox) => checkbox.value);
      const reason = document.getElementById("collectProductReason").value.trim();
      if (!names.length) return showInlineError("已开通法币代收时至少保留一个代收产品。", null);
      if (!reason) return showInlineError("请填写产品配置原因。", "collectProductReason");
      const currentNames = item.collectConfig.products.map((product) => product[0]);
      if (names.length === currentNames.length && names.every((name) => currentNames.includes(name))) return showInlineError("产品配置没有变化，无需重复保存。");
      const defaults = {
        "银行卡转账": ["银行卡转账", "CNY", "统一费率", "按统一费率", "单笔 50,000 / 日 2,000,000"],
        "CNY-快捷支付": ["CNY-快捷支付", "CNY", "统一费率", "按统一费率", "单笔 20,000 / 日 100,000"],
        "扫码收款": ["扫码收款", "CNY", "统一费率", "按统一费率", "单笔 20,000 / 日 800,000"]
      };
      const button = document.getElementById("collectProductConfirm");
      button.disabled = true;
      button.textContent = "保存中…";
      setTimeout(() => {
        item.collectConfig.products = names.map((name) => item.collectConfig.products.find((product) => product[0] === name) || defaults[name]);
        item.logs.unshift([nowText(), "配置代收产品", currentTenantOperator.account, `${currentNames.join("、") || "无"} → ${names.join("、")}；${reason}`]);
        activeModalTab = "代收配置";
        renderDetailModal(item);
        showToast("代收产品已保存；统一费率未改变");
      }, 350);
    }

    function saveMerchantBasic(item) {
      clearInlineError();
      const button = document.getElementById("saveMerchantBasic");
      const name = document.getElementById("merchantBasicName").value.trim();
      const type = document.getElementById("merchantBasicType").value;
      const owner = document.getElementById("merchantBasicOwner").value.trim();
      const phone = document.getElementById("merchantBasicPhone").value.trim();
      const parentMerchantId = document.getElementById("merchantBasicParent").value;
      const childCount = merchants.filter((merchant) => merchant.parentMerchantId === item.id).length;

      if (!name) return showInlineError("请填写商户名称。", "merchantBasicName");
      if (merchants.some((merchant) => merchant.id !== item.id && merchant.name.toLowerCase() === name.toLowerCase())) return showInlineError("当前租户已存在同名商户。", "merchantBasicName");
      if (!owner) return showInlineError("请填写联系人。", "merchantBasicOwner");
      if (!phone) return showInlineError("请填写联系电话。", "merchantBasicPhone");
      if (type === "子商户" && !parentMerchantId) return showInlineError("子商户必须选择上级主商户。", "merchantBasicParent");
      if (type !== "主商户" && childCount > 0) return showInlineError(`该商户仍有 ${childCount} 个子商户，请先调整子商户归属后再修改类型。`, "merchantBasicType");
      const before = `${item.name} / ${item.type}${item.parentMerchantId ? ` / ${item.parentMerchantId}` : ""}`;
      const after = `${name} / ${type}${parentMerchantId ? ` / ${parentMerchantId}` : ""}`;
      if (before === after && item.owner === owner && item.phone === phone) return showInlineError("当前基础资料没有变化，无需重复保存。");

      button.disabled = true;
      button.textContent = "保存中…";
      setTimeout(() => {
        item.name = name;
        item.type = type;
        item.owner = owner;
        item.phone = phone;
        item.parentMerchantId = type === "子商户" ? parentMerchantId : "";
        item.logs.unshift([nowText(), "保存基础资料", currentTenantOperator.account, `${before} → ${after}`]);
        renderDetailModal(item);
        showToast("商户基础资料已保存，列表和关系信息已刷新");
      }, 300);
    }

    function openCapabilityConfirm(item, capability, action) {
      document.getElementById("modal").innerHTML = `
        <div class="modal-head" data-astryx="DialogHeader">
          <div><h2>${action}${capability}</h2><p>${escapeHtml(item.name)} · ${item.id}</p></div>
          <button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" data-astryx="DialogBody">
          <div class="info-grid" data-astryx="DescriptionList">
            <div class="info-item"><div class="k">调整范围</div><div class="v">仅当前商户</div></div>
            <div class="info-item"><div class="k">平台审核</div><div class="v">不需要</div></div>
            <div class="info-item"><div class="k">当前能力</div><div class="v">${tag(capability)}</div></div>
            <div class="info-item"><div class="k">目标状态</div><div class="v">${tag(action === "开通" ? "待配置" : "未开通")}</div></div>
          </div>
          <div class="field wide"><label for="capabilityReason">调整原因</label><input class="input" id="capabilityReason" placeholder="必填，将写入永久操作日志"></div>
          <div class="notice">${action === "关闭" ? "关闭后不再接受该业务的新订单；已经创建的订单继续按原流程完成。" : "开通后先进入待配置状态，完成产品、费率和接入配置后才能正常接单。"}</div>
          <div class="field-error" id="modalError" role="alert"></div>
        </div>
        <div class="modal-footer" data-astryx="FooterActions">
          <button class="btn" type="button" id="capabilityCancel">取消</button>
          <button class="btn ${action === "关闭" ? "danger" : "primary"}" type="button" id="capabilityConfirm">确认${action}</button>
        </div>
      `;
      showModal("small");
      bindModalEvents();
      document.getElementById("capabilityCancel").addEventListener("click", () => renderDetailModal(item));
      document.getElementById("capabilityConfirm").addEventListener("click", () => applyCapabilityChange(item, capability, action));
    }

    function applyCapabilityChange(item, capability, action) {
      clearInlineError();
      const reason = document.getElementById("capabilityReason").value.trim();
      if (!reason) return showInlineError("请填写调整原因。", "capabilityReason");
      const button = document.getElementById("capabilityConfirm");
      button.disabled = true;
      button.textContent = "处理中…";
      setTimeout(() => {
        const enabled = action === "开通";
        item.capabilities = enabled ? [...new Set([...item.capabilities, capability])] : item.capabilities.filter((itemCapability) => itemCapability !== capability);
        const cfg = capability === "法币代收" ? item.collectConfig : item.payoutConfig;
        cfg.status = enabled ? "待配置" : "未开通";
        item.logs.unshift([nowText(), `${action}${capability}`, currentTenantOperator.account, `${reason}；不进入平台审核`]);
        activeModalTab = "业务权限";
        renderDetailModal(item);
        showToast(`${capability}已${action === "开通" ? "开通并进入待配置" : "关闭"}；已创建订单不受影响`);
      }, 350);
    }

    function validateAccessChange(item) {
      clearInlineError();
      const callbackId = "accessCallback-shared";
      const whitelistId = "accessWhitelist-shared";
      const callback = document.getElementById(callbackId).value.trim();
      const whitelist = document.getElementById(whitelistId).value.trim();
      const google2fa = document.getElementById("access2fa-shared").value.trim();
      const oldCallback = merchantCallback(item);
      const oldWhitelist = merchantWhitelist(item);
      const callbackChanged = callback !== oldCallback;
      const whitelistChanged = whitelist !== oldWhitelist;

      if (callback && !isPublicHttpsUrl(callback)) return showInlineError("统一回调 URL 必须使用公网 HTTPS；可以使用合法的非 443 端口。", callbackId);
      if (!validIpList(whitelist)) return showInlineError("请输入有效的公网 IPv4、IPv6 或明确网段，多个条目用逗号或换行分隔。", whitelistId);
      if (whitelistChanged && google2fa !== currentTenantOperator.google2fa) return showInlineError("Google 2FA 验证失败，IP 白名单尚未修改。", "access2fa-shared");
      if (!callbackChanged && !whitelistChanged) return showInlineError("当前内容没有变化，无需重复保存。");

      openAccessConfirm(item, { callback, whitelist, oldCallback, oldWhitelist, callbackChanged, whitelistChanged });
    }

    function openAccessConfirm(item, change) {
      document.getElementById("modal").innerHTML = `
        <div class="modal-head" data-astryx="DialogHeader">
          <div><h2>确认修改自有系统接入配置</h2><p>${escapeHtml(item.name)} · ${item.id}</p></div>
          <button class="modal-close" type="button" id="modalClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" data-astryx="DialogBody">
          ${change.callbackChanged ? `
            <div class="info-grid" data-astryx="DescriptionList">
              <div class="info-item"><div class="k">当前有效回调</div><div class="v mono">${escapeHtml(change.oldCallback || "未配置")}</div></div>
              <div class="info-item"><div class="k">待测试回调</div><div class="v mono">${escapeHtml(change.callback || "未配置")}</div></div>
            </div>
            <div class="notice">${change.callback ? "确认后开始安全、连通和签名测试。测试通过前继续使用当前回调，通过后切换。" : "确认后停用统一回调；商户后台和业务结果不受影响。"}</div>
          ` : ""}
          ${change.whitelistChanged ? `
            <div class="info-grid" data-astryx="DescriptionList">
              <div class="info-item"><div class="k">原 IP 白名单</div><div class="v mono">${escapeHtml(change.oldWhitelist || "未配置")}</div></div>
              <div class="info-item"><div class="k">新 IP 白名单</div><div class="v mono">${escapeHtml(change.whitelist || "不限制")}</div></div>
            </div>
          ` : ""}
          <div class="field-error" id="modalError" role="alert"></div>
        </div>
        <div class="modal-footer" data-astryx="FooterActions">
          <button class="btn" type="button" id="accessChangeCancel">取消</button>
          <button class="btn primary" type="button" id="accessChangeConfirm"><i data-lucide="shield-check"></i>${change.callbackChanged && change.callback ? "开始测试并保存" : "确认保存"}</button>
        </div>
      `;
      showModal("small");
      bindModalEvents();
      document.getElementById("accessChangeCancel").addEventListener("click", () => renderDetailModal(item));
      document.getElementById("accessChangeConfirm").addEventListener("click", () => applyAccessChange(item, change));
    }

    function applyAccessChange(item, change) {
      const button = document.getElementById("accessChangeConfirm");
      button.disabled = true;
      button.textContent = change.callbackChanged && change.callback ? "正在进行三项测试…" : "正在保存…";
      item.pendingCallbacks = item.pendingCallbacks || {};
      if (change.callbackChanged && change.callback) item.pendingCallbacks.shared = change.callback;

      setTimeout(() => {
        item.callback = change.callback || "未配置";
        item.whitelist = change.whitelist || "未配置";
        item.collectConfig.callbackIp = change.whitelist || "未配置";
        item.payoutConfig.orderIp = change.whitelist || "未配置";
        item.ipStatus = change.whitelist ? "已确认" : "待确认";
        delete item.pendingCallbacks.shared;
        item.logs.unshift([nowText(), "修改自有系统接入配置", currentTenantOperator.account, `${change.callbackChanged ? (change.callback ? "新回调通过三项测试并切换；" : "统一回调已停用；") : ""}${change.whitelistChanged ? "IP 白名单已更新" : ""}`]);
        openAccessResult(item, change);
      }, 500);
    }

    function openAccessResult(item, change) {
      document.getElementById("modal").innerHTML = `

          item.logs.unshift([security.lastReset, "重置管理员密码", currentTenantOperator.account, "全部会话已清除；一次性密码 24 小时有效"]);

        }

    function createMerchant() {
      clearInlineError();
      const submit = document.getElementById("createMerchantSubmit");
      const name = document.getElementById("createMerchantName").value.trim();
      const type = document.getElementById("createMerchantType").value;
      const owner = document.getElementById("createMerchantOwner").value.trim();

      const unifiedCallback = document.getElementById("createUnifiedCallback").value.trim();
      const whitelist = document.getElementById("createMerchantWhitelist").value.trim();
      const google2fa = document.getElementById("createMerchant2fa").value.trim();
      const singleLimit = parseCnyInput(document.getElementById("createSingleLimit").value);
      const dailyLimit = parseCnyInput(document.getElementById("createDailyLimit").value);
      const capabilities = [
        document.getElementById("createCapCollect").checked ? "法币代收" : "",
        document.getElementById("createCapPayout").checked ? "法币代付" : ""
      ].filter(Boolean);

      if (!name) return showInlineError("请填写商户名称。", "createMerchantName");
      if (merchants.some((merchant) => merchant.name.toLowerCase() === name.toLowerCase())) return showInlineError("当前租户已存在同名商户。", "createMerchantName");
      if (!owner) return showInlineError("请填写联系人。", "createMerchantOwner");
      if (!phone) return showInlineError("请填写联系电话。", "createMerchantPhone");
      if (type === "子商户" && !parentMerchantId) return showInlineError("子商户必须选择上级主商户。", "createMerchantParent");
      if (!capabilities.length) return showInlineError("至少选择一项当前租户已开通的业务能力。", "createCapCollect");
      if (unifiedCallback && !isPublicHttpsUrl(unifiedCallback)) return showInlineError("统一回调 URL 必须使用公网 HTTPS，不能使用本机或内网地址。", "createUnifiedCallback");
      if (!validIpList(whitelist)) return showInlineError("请输入有效的公网 IPv4、IPv6 或明确网段，多个条目用逗号或换行分隔。", "createMerchantWhitelist");
      if (singleLimit === null) return showInlineError("单笔限额必须大于 0，且最多两位小数。", "createSingleLimit");
      if (dailyLimit === null) return showInlineError("日限额必须大于 0，且最多两位小数。", "createDailyLimit");

          orderApi: "https://gateway.huisheng.example/collect/create", queryApi: "https://gateway.huisheng.example/collect/query", doc: "ShowDoc / 代收 API", callbackIp: whitelist || "未配置"
        },

          orderApi: "https://gateway.huisheng.example/payout/create", queryApi: "https://gateway.huisheng.example/payout/query", doc: "ShowDoc / 代付 API", orderIp: whitelist || "未配置"
        },
        created,
        callback: unifiedCallback || "未配置",
        whitelist: whitelist || "未配置",
        limits: { single: singleLimit, daily: dailyLimit },
        wallets: [
          ["CNY", "提款钱包", "0.00", "0.00", "0.00"],
          ["CNY", "代收钱包", "0.00", "0.00", "0.00"],
          ["CNY", "代付钱包", "0.00", "0.00", "0.00"]
        ],
        adminSecurity: { account: "admin", passwordStatus: "一次性密码待使用", twoFaStatus: "待绑定", sessions: "无在线会话", lastReset: created },

    function showModal(size) {
      const modal = document.getElementById("modal");
      const opening = !modal.classList.contains("open");
      if (opening) merchantModalReturnFocus = document.activeElement;
      modal.classList.toggle("small-modal", size === "small");
      modal.setAttribute("aria-label", modal.querySelector("h2")?.textContent.trim() || "商户操作");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.getElementById("modalMask").classList.add("open");
      document.getElementById("modalMask").setAttribute("aria-hidden", "false");
      if (opening) {
        requestAnimationFrame(() => {
          const firstControl = modal.querySelector('input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not(.modal-close):not([disabled])');
          (firstControl || modal.querySelector("button:not([disabled])") || modal).focus();

      }
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      if (!modal.classList.contains("open")) return;
      modal.querySelectorAll('input[type="password"], input[inputmode="numeric"], input[autocomplete="one-time-code"]').forEach(input => { input.value = ""; });
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.getElementById("modalMask").classList.remove("open");
      document.getElementById("modalMask").setAttribute("aria-hidden", "true");
      modal.innerHTML = "";
      const returnTarget = merchantModalReturnFocus;
      merchantModalReturnFocus = null;
      if (returnTarget?.isConnected && returnTarget.offsetParent !== null) returnTarget.focus();
    }

    function merchantModalFocusable() {
      const modal = document.getElementById("modal");
      return [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')]
        .filter(element => element.offsetParent !== null && element.getAttribute("aria-hidden") !== "true");
    }

    function trapMerchantModalFocus(event) {
      const modal = document.getElementById("modal");
      const focusable = merchantModalFocusable();
      if (!focusable.length) {
        event.preventDefault();
        modal.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function bindModalEvents() {
      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.querySelectorAll(".modal-tab[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {

        btn.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
          event.preventDefault();
          const tabs = [...document.querySelectorAll(".modal-tab[data-tab]")];
          const current = tabs.indexOf(btn);
          const next = event.key === "ArrowRight" ? (current + 1) % tabs.length : (current - 1 + tabs.length) % tabs.length;
          tabs[next].click();
        });

      document.querySelector("[data-funding-approve]")?.addEventListener("click", (event) => approveFunding(event.currentTarget.dataset.fundingApprove));

      document.querySelectorAll("[data-copy-value]").forEach((button) => {
        button.addEventListener("click", async () => {
